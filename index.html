<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four Fighter Online</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b13;color:#fff;font-family:Arial,sans-serif}
#app{max-width:1100px;margin:auto;padding:16px}
h1{text-align:center;margin:8px 0 14px}
.panel{background:#151a28;border:1px solid #30384e;border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #46506b}
input{background:#0d1019;color:#fff;width:170px}
button{background:#2f74ff;color:white;cursor:pointer}
button:hover{filter:brightness(1.1)}
#status{text-align:center;min-height:22px}
#game{width:100%;height:auto;display:block;background:#111;border-radius:10px;border:1px solid #30384e}
.controls{font-size:13px;line-height:1.6;color:#c8cee0}
.hidden{display:none}
</style>
</head>
<body>
<div id="app">
<h1>⚔️ Four Fighter Online</h1>

<div class="panel" id="lobby">
  <div class="row">
    <button id="create">Create Room</button>
    <input id="room" placeholder="ROOM CODE" maxlength="5">
    <button id="join">Join Room</button>
  </div>
  <p id="status">Create a room or enter a friend's room code.</p>
</div>

<div class="panel hidden" id="gamePanel">
  <div class="row">
    <strong>Room: <span id="code"></span></strong>
    <span>| Your fighter: <span id="slot"></span></span>
    <button id="restart">Restart</button>
  </div>

  <canvas id="game" width="1000" height="560"></canvas>

  <div class="controls">
    <b>Same controls for every player/browser:</b>
    WASD = move/jump/block · J = punch · K = kick.
    <br>
    <b>Important:</b> because this is online, each person uses the same WASD/J/K controls on their own computer.
  </div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const lobby = document.getElementById("lobby");
const gamePanel = document.getElementById("gamePanel");
const statusEl = document.getElementById("status");
const roomInput = document.getElementById("room");
const codeEl = document.getElementById("code");
const slotEl = document.getElementById("slot");

let myId = null;
let mySlot = null;
let roomCode = "";
let state = {players:[],started:false};
const keys = {};

const skins = [1,2,3,4].map(n => {
  const img = new Image();
  img.src = `/assets/player${n}.png`;
  return img;
});

const names = ["PLAYER 1","PLAYER 2","PLAYER 3","PLAYER 4"];
const colors = ["#4dabf7","#ff4d6d","#69db7c","#ffd43b"];

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
});
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

document.getElementById("create").onclick = () => {
  socket.emit("createRoom", result => enterResult(result));
};

document.getElementById("join").onclick = () => {
  socket.emit("joinRoom", {code: roomInput.value}, result => enterResult(result));
};

document.getElementById("restart").onclick = () => socket.emit("restart");

function enterResult(result){
  if(!result?.ok){
    statusEl.textContent = result?.error || "Could not join room.";
    return;
  }
  roomCode = result.code;
  mySlot = result.slot;
  codeEl.textContent = roomCode;
  slotEl.textContent = `P${mySlot + 1}`;
  lobby.classList.add("hidden");
  gamePanel.classList.remove("hidden");
  statusEl.textContent = "";
  updateInput();
}

socket.on("connect", () => myId = socket.id);
socket.on("state", newState => state = newState);

function updateInput(){
  if(!myId) return;

  let vx = 0;
  if(keys["a"]) vx -= 5;
  if(keys["d"]) vx += 5;

  // W = jump, S = block. A/D = horizontal movement.
  let vy = 0;
  const me = state.players.find(p => p.id === myId);
  if(keys["w"] && me && me.y >= 345) vy = -15;

  let attack = null;
  if(keys["j"]) attack = "punch";
  else if(keys["k"]) attack = "kick";

  const blocking = Boolean(keys["s"]);
  const facing = vx !== 0 ? (vx > 0 ? 1 : -1) : (me?.facing || 1);

  socket.emit("input", {vx, vy, attack, blocking, facing});
}
setInterval(updateInput, 1000/30);

function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,560);
  g.addColorStop(0,"#0b1730");
  g.addColorStop(1,"#151824");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,1000,560);

  ctx.fillStyle="#1e2945";
  for(let i=0;i<15;i++){
    const x=i*72, h=110+(i%4)*32;
    ctx.fillRect(x,455-h,60,h);
  }

  ctx.fillStyle="#333944";
  ctx.fillRect(0,455,1000,105);

  ctx.strokeStyle="#555b68";
  for(let x=0;x<1000;x+=50){
    ctx.beginPath();
    ctx.moveTo(x,455);
    ctx.lineTo(x+25,560);
    ctx.stroke();
  }
}

function drawHealthBar(p){
  const x=25+p.slot*245;
  ctx.fillStyle="#08090d";
  ctx.fillRect(x,18,210,18);
  ctx.fillStyle=colors[p.slot%4];
  ctx.fillRect(x,18,210*Math.max(0,p.health)/100,18);
  ctx.fillStyle="#fff";
  ctx.font="12px Arial";
  ctx.textAlign="left";
  ctx.fillText(`${names[p.slot%4]} ${Math.ceil(p.health)}`,x,14);
}

function drawPlayer(p){
  const img = skins[p.slot % 4];

  ctx.save();
  if(p.health<=0) ctx.globalAlpha=.35;

  // Ground shadow
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(p.x+28,466,34,8,0,0,Math.PI*2);
  ctx.fill();

  // Character skin. All four images are the user's uploaded skins, in upload order.
  if(img.complete && img.naturalWidth){
    const w=70, h=130;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(img,p.x-8,p.y-10,w,h);
  } else {
    ctx.fillStyle=colors[p.slot%4];
    ctx.fillRect(p.x+8,p.y+15,40,95);
  }

  // Attack indicator
  if(p.attack){
    ctx.strokeStyle=p.attack==="kick" ? "#ffd43b" : "#fff";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.arc(p.x+28,p.y+55,48,0,Math.PI*2);
    ctx.stroke();
  }

  // Block indicator
  if(p.blocking){
    ctx.strokeStyle="#65d9ff";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.arc(p.x+28,p.y+55,50,-Math.PI/2,Math.PI/2);
    ctx.stroke();
  }

  // Player label
  ctx.fillStyle=colors[p.slot%4];
  ctx.font="bold 14px Arial";
  ctx.textAlign="center";
  ctx.fillText(`P${p.slot+1}`,p.x+28,p.y-16);

  ctx.restore();
}

function drawHUD(){
  state.players.forEach(drawHealthBar);

  ctx.textAlign="center";
  ctx.font="bold 18px Arial";
  ctx.fillStyle="#fff";

  if(!state.started){
    ctx.fillText(`Waiting for players... ${state.players.length}/4`,500,300);
    return;
  }

  const alive=state.players.filter(p=>p.health>0);
  if(alive.length===1){
    ctx.fillText(`P${alive[0].slot+1} WINS!`,500,290);
  } else if(alive.length===0){
    ctx.fillText("DRAW!",500,290);
  }
}

function loop(){
  drawBackground();
  for(const p of state.players) drawPlayer(p);
  drawHUD();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
